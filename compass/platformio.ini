; Ordo compass firmware for the Waveshare ESP32-S3-Touch-AMOLED-1.75 family.
;
; Two environments, one per board revision. They share the display, touch,
; IMU and PMU; they differ in a few GPIOs and in flash size (see
; include/board_pins.h). `amoled175c` is the board sold as
; "ESP32-S3-Touch-AMOLED-1.75C" (with or without battery).
;
;   pio run -e amoled175c            # build
;   pio run -e amoled175c -t upload  # flash over USB
;   pio run -e amoled175c-debug -t upload && pio device monitor -b 115200
;                                    # the same firmware with a serial log
;
; The release environments are silent on purpose: a keychain has nobody
; reading its serial port, and starting it costs time on every wake.
;
; The platform is pioarduino's fork of platform-espressif32, which ships the
; Arduino-ESP32 3.x core the board's own examples are validated against.

[platformio]
default_envs = amoled175c

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.31/platform-espressif32.zip
framework = arduino
board = esp32-s3-devkitc-1
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
build_unflags = -std=gnu++11
build_flags =
  -std=gnu++17
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
  -DCORE_DEBUG_LEVEL=0
  -DLV_CONF_INCLUDE_SIMPLE
  -DORDO_FIRMWARE_VERSION=\"0.3.0\"
  -I include
; Exact versions: the ones this firmware was last compiled against. Bump them
; on purpose, with a build on both environments (LVGL minor releases have
; broken the build before).
lib_deps =
  moononournation/GFX Library for Arduino @ 1.6.9
  lvgl/lvgl @ 9.6.0
  lewisxhe/SensorLib @ 0.3.3
  lewisxhe/XPowersLib @ 0.2.9
  bblanchon/ArduinoJson @ 7.4.3
; `chain` scans nested includes without running the preprocessor: with `deep+`
; the core's WiFi library loses its dependency on Network (its include sits
; behind an SoC guard the LDF cannot evaluate) and fails on Network.h.
lib_ldf_mode = chain

; ESP32-S3-Touch-AMOLED-1.75C: 32 MB flash, LCD reset on GPIO1, touch reset on
; GPIO2, PWR button on GPIO3, no SD card, no IO expander.
[env:amoled175c]
build_flags =
  ${env.build_flags}
  -DORDO_BOARD_AMOLED_175C
board_upload.flash_size = 32MB
board_upload.maximum_size = 33554432
board_build.partitions = partitions/ordo_32mb.csv

; ESP32-S3-Touch-AMOLED-1.75 (standard, -B, -G): 16 MB flash, LCD reset on
; GPIO39, touch reset on GPIO40, PWR button read through the TCA9554.
[env:amoled175]
build_flags =
  ${env.build_flags}
  -DORDO_BOARD_AMOLED_175
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = partitions/ordo_16mb.csv

; The 1.75C with serial logging (ORDO_LOG) and the core's own messages. It
; wakes a little slower; use it to see what the firmware is doing, not to
; measure the battery.
[env:amoled175c-debug]
extends = env:amoled175c
build_flags =
  ${env:amoled175c.build_flags}
  -DORDO_DEBUG
  -UCORE_DEBUG_LEVEL
  -DCORE_DEBUG_LEVEL=3
